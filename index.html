<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คุณเป็นคนยั่งยืนสายไหน?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#132038;
    --ink-soft:#4a5568;
    --paper:#faf9f5;
    --card:#ffffff;
    --line:#e6e2d8;
    --blue:#0072bc;

    --c-planning:#3e4c8a;
    --c-action:#e8702a;
    --c-people:#e85c6b;
    --c-story:#e0a233;
    --c-guardian:#2f7566;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Sarabun',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px 64px;
    line-height:1.6;
  }
  .stage{width:100%; max-width:620px;}

  .flag{
    position:relative;
    height:14px;
    display:flex;
    border-radius:3px;
    overflow:hidden;
    margin-bottom:22px;
  }
  .flag span{flex:1;}
  .flag span:nth-child(1){background:var(--c-planning);}
  .flag span:nth-child(2){background:var(--c-action);}
  .flag span:nth-child(3){background:var(--c-people);}
  .flag span:nth-child(4){background:var(--c-story);}
  .flag span:nth-child(5){background:var(--c-guardian);}

  .brand{
    font-family:'Kanit',sans-serif;
    font-weight:500;
    font-size:13px;
    letter-spacing:.02em;
    color:var(--ink-soft);
    margin:0 0 6px;
  }
  h1{
    font-family:'Kanit',sans-serif;
    font-weight:700;
    font-size:clamp(26px,5vw,34px);
    line-height:1.25;
    margin:0 0 10px;
  }
  .sub{
    color:var(--ink-soft);
    font-size:16px;
    max-width:52ch;
    margin:0 0 28px;
  }

  .btn{
    font-family:'Sarabun',sans-serif;
    font-weight:600;
    font-size:16px;
    border:none;
    cursor:pointer;
    border-radius:10px;
    padding:14px 26px;
    background:var(--ink);
    color:#fff;
    transition:transform .12s ease, opacity .12s ease;
  }
  .btn:hover{opacity:.88;}
  .btn:active{transform:scale(.98);}
  .btn.ghost{
    background:transparent;
    color:var(--ink);
    border:1.5px solid var(--line);
  }
  .btn.ghost:hover{border-color:var(--ink); opacity:1;}

  .progress{display:flex; gap:6px; margin-bottom:26px;}
  .dot{height:6px; flex:1; border-radius:4px; background:var(--line); transition:background .25s ease;}
  .dot.done{background:var(--ink);}
  .dot.current{background:var(--blue);}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:30px 28px;
    animation:rise .32s ease;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .qnum{
    font-family:'Kanit',sans-serif;
    font-weight:600;
    color:var(--blue);
    font-size:13px;
    letter-spacing:.03em;
    margin-bottom:10px;
  }
  .scenario{font-size:19px; font-weight:500; margin:0 0 22px;}
  .options{display:flex; flex-direction:column; gap:10px;}
  .opt{
    text-align:left;
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    font-family:'Sarabun',sans-serif;
    font-size:15px;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .opt:hover{border-color:var(--blue); background:#fff;}
  .opt:active{transform:scale(.985);}
  .opt.picked{background:var(--ink); color:#fff; border-color:var(--ink);}
  .opt:disabled{cursor:default; opacity:.5;}
  .opt.picked:disabled{opacity:1;}

  .intro-art{display:flex; gap:8px; margin:6px 0 24px; flex-wrap:wrap;}
  .chip{
    font-family:'Kanit',sans-serif;
    font-size:12.5px;
    font-weight:500;
    color:#fff;
    padding:6px 12px;
    border-radius:999px;
  }

  .result-head{text-align:center; margin-bottom:6px;}
  .result-title-eyebrow{font-family:'Kanit',sans-serif; font-size:13px; color:var(--ink-soft); margin:0 0 3px;}
  .result-title{font-family:'Kanit',sans-serif; font-size:26px; font-weight:700; margin:0;}
  .result-track{font-family:'Kanit',sans-serif; font-size:14px; font-weight:600; margin:4px 0 0;}
  .character-wrap{display:flex; justify-content:center; margin:6px 0 14px;}
  .character-wrap svg{width:190px; height:auto;}
  .result-body p{font-size:16px; margin:0 0 16px;}
  .project-box{
    background:var(--paper);
    border:1px solid var(--line);
    border-left:3px solid var(--blue);
    border-radius:8px;
    padding:12px 14px;
    margin:2px 0 4px;
  }
  .project-label{
    font-family:'Kanit',sans-serif;
    font-size:12px;
    font-weight:600;
    color:var(--blue);
    margin:0 0 4px;
  }
  .project-text{font-size:14.5px; margin:0; color:var(--ink-soft);}
  .section-label{font-family:'Kanit',sans-serif; font-size:13px; font-weight:600; color:var(--ink-soft); margin:26px 0 6px;}

  .radar-wrap{display:flex; justify-content:center; margin:6px 0 4px;}
  .radar-wrap svg{width:100%; max-width:388px; height:auto;}
  .radar-label{font-family:'Sarabun',sans-serif; font-weight:600;}
  .radar-pct{font-family:'Kanit',sans-serif; font-weight:600;}

  .legend{display:flex; flex-direction:column; gap:8px; margin-top:18px;}
  .legend-row{display:flex; align-items:center; gap:10px; font-size:14px;}
  .legend-dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .legend-name{flex:1;}
  .legend-pct{font-family:'Kanit',sans-serif; font-weight:600; color:var(--ink-soft);}

  .qr-cta{
    display:flex;
    align-items:center;
    gap:18px;
    margin-top:26px;
    padding:18px;
    border-radius:14px;
    background:var(--ink);
    color:#fff;
  }
  .qr-cta-text{flex:1; min-width:0;}
  .qr-cta-title{
    font-family:'Kanit',sans-serif;
    font-weight:600;
    font-size:16.5px;
    line-height:1.45;
    margin:0 0 6px;
    text-wrap:balance;
  }
  .qr-cta-desc{font-size:14px; line-height:1.55; margin:0; color:#b9c2d4;}
  .qr-cta-desc .nowrap{white-space:nowrap;}
  .qr-cta-scan{
    font-family:'Kanit',sans-serif;
    font-size:12.5px;
    font-weight:500;
    letter-spacing:.02em;
    color:#8fb9dd;
    margin:10px 0 0;
  }
  .qr-cta-tile{
    background:#fff;
    border-radius:10px;
    padding:8px;
    flex-shrink:0;
    line-height:0;
  }
  .qr-cta-tile img{width:140px; height:140px; max-width:100%; display:block;}
  @media (max-width:470px){
    .qr-cta{flex-direction:column; align-items:stretch; text-align:center;}
    .qr-cta-tile{align-self:center;}
    .qr-cta-tile img{width:172px; height:172px;}
  }

  .actions{display:flex; gap:12px; margin-top:28px; flex-wrap:wrap;}
  .copied-note{font-size:13px; color:var(--ink-soft); margin-top:8px; height:16px;}
</style>
</head>
<body>
<div class="stage">
  <div class="flag"><span></span><span></span><span></span><span></span><span></span></div>
  <div id="app"></div>
</div>

      {t:"ลงมือทำอะไรสักอย่างด้วยมือตัวเอง", k:"action"},
      {t:"ชวนคนใกล้ตัวมาทำกิจกรรมดี ๆ ร่วมกัน", k:"people"},
      {t:"เขียน/ถ่ายรูป/เล่าเรื่องราวของวันนั้นให้คนอื่นฟัง", k:"story"},
      {t:"จัดของ เช็คความเรียบร้อยของบ้านให้ปลอดภัย", k:"guardian"}
    ]
  },
  {
    scenario:"ถ้าต้องเลือกงานในฝันสักวัน คุณอยากทำอะไรมากที่สุด?",
    options:[
      {t:"นั่งดูตัวเลข วางแผนกลยุทธ์", k:"planning"},
      {t:"ลงพื้นที่ลุยงานจริงด้วยตัวเอง", k:"action"},
      {t:"ดูแลและพัฒนาคนในทีม", k:"people"},
      {t:"เล่าเรื่องราวดี ๆ ให้คนอื่นฟัง", k:"story"},
      {t:"ตรวจสอบให้ทุกอย่างถูกต้องและปลอดภัย", k:"guardian"}
    ]
  }
];

const MAX_PER_TRACK = {};
TRACK_ORDER.forEach(k=>MAX_PER_TRACK[k]=0);
QUESTIONS.forEach(q=>q.options.forEach(o=>MAX_PER_TRACK[o.k]++));

let step = -1;
let scores = {};
TRACK_ORDER.forEach(k=>scores[k]=0);
let answered = false;

const app = document.getElementById('app');

function renderIntro(){
  const chips = TRACK_ORDER.map(k=>{
    const v = TRACKS[k];
    return `<span class="chip" style="background:${v.color}">${v.name}</span>`;
  }).join('');
  app.innerHTML = `
    <p class="brand">GOOD GROWTH · โตได้ โตดี</p>
    <h1>คุณเป็นคนยั่งยืนสายไหน?</h1>
    <p class="sub">8 คำถามง่าย ๆ เล่นสนุก ๆ ตอบตามสัญชาตญาณ แล้วมาดู “แผนที่พลัง” ของคุณว่าแต่ละด้านแข็งแรงแค่ไหน — เหมือนสเตตัสตัวละครในเกม</p>
    <div class="intro-art">${chips}</div>
    <button class="btn" id="startBtn">เริ่มทำแบบทดสอบ</button>
  `;
  document.getElementById('startBtn').addEventListener('click', startQuiz);
}

function startQuiz(){
  step = 0;
  TRACK_ORDER.forEach(k=>scores[k]=0);
  renderQuestion();
}

function renderProgress(){
  return `<div class="progress">${QUESTIONS.map((_,i)=>{
    let cls='dot';
    if(i<step) cls+=' done';
    if(i===step) cls+=' current';
    return `<div class="${cls}"></div>`;
  }).join('')}</div>`;
}

function renderQuestion(){
  answered = false;
  const q = QUESTIONS[step];
  app.innerHTML = `
    ${renderProgress()}
    <div class="card">
      <p class="qnum">ข้อ ${step+1} / ${QUESTIONS.length}</p>
      <p class="scenario">${q.scenario}</p>
      <div class="options">
        ${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${o.t}</button>`).join('')}
      </div>
    </div>
  `;
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=> pick(Number(btn.dataset.i)));
  });
}

function pick(i){
  if(answered) return;
  answered = true;
  const q = QUESTIONS[step];
  scores[q.options[i].k]++;
  document.querySelectorAll('.opt').forEach((el,idx)=>{
    el.disabled = true;
    if(idx===i) el.classList.add('picked');
  });
  setTimeout(()=>{
    step++;
    if(step<QUESTIONS.length){ renderQuestion(); }
    else { renderResult(); }
  }, 380);
}

// ---------- radar / strength web map ----------
function polar(cx,cy,r,angleDeg){
  const rad = (Math.PI/180)*(angleDeg-90);
  return [cx + r*Math.cos(rad), cy + r*Math.sin(rad)];
}

function buildRadarSVG(data){
  // data: array in TRACK_ORDER order of {key,label,pct,color}
  const n = data.length;
  const cx=160, cy=160, maxR=100;
  const step = 360/n;
  const levels = [0.25,0.5,0.75,1];

  const gridPolys = levels.map(l=>{
    const pts = data.map((d,i)=> polar(cx,cy,maxR*l, i*step).join(',')).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="#e6e2d8" stroke-width="1"/>`;
  }).join('');

  const spokes = data.map((d,i)=>{
    const [x,y] = polar(cx,cy,maxR, i*step);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e6e2d8" stroke-width="1"/>`;
  }).join('');

  const dataPts = data.map((d,i)=> polar(cx,cy, maxR*(d.pct/100), i*step).join(',')).join(' ');

  const dots = data.map((d,i)=>{
    const [x,y] = polar(cx,cy, maxR*(d.pct/100), i*step);
    return `<circle cx="${x}" cy="${y}" r="4.5" fill="${d.color}" stroke="#fff" stroke-width="1.5"/>`;
  }).join('');

  const labels = data.map((d,i)=>{
    const [lx,ly] = polar(cx,cy, maxR+34, i*step);
    let anchor='middle';
    if(lx < cx-8) anchor='end';
    else if(lx > cx+8) anchor='start';
    return `
      <text x="${lx}" y="${ly-3}" text-anchor="${anchor}" class="radar-label" font-size="12.5" fill="var(--ink)">${d.label}</text>
      <text x="${lx}" y="${ly+13}" text-anchor="${anchor}" class="radar-pct" font-size="13" fill="${d.color}">${d.pct}%</text>
    `;
  }).join('');

  return `
    <svg viewBox="-34 0 388 320" xmlns="http://www.w3.org/2000/svg">
      ${gridPolys}
      ${spokes}
      <polygon points="${dataPts}" fill="var(--blue)" fill-opacity="0.22" stroke="var(--blue)" stroke-width="2"/>
      ${dots}
      ${labels}
    </svg>
  `;
}

function renderResult(){
  const data = TRACK_ORDER.map(k=>{
    const pct = MAX_PER_TRACK[k] ? Math.round(scores[k]/MAX_PER_TRACK[k]*100) : 0;
    return {key:k, label:TRACKS[k].name.replace('สาย',''), pct, color:TRACKS[k].color};
  });
  const ranked = [...data].sort((a,b)=> b.pct - a.pct);
  const top = TRACKS[ranked[0].key];
  const topColor = top.color;

  const legend = [...data].sort((a,b)=> b.pct - a.pct).map(d=>`
    <div class="legend-row">
      <span class="legend-dot" style="background:${d.color}"></span>
      <span class="legend-name">${TRACKS[d.key].name}</span>
      <span class="legend-pct">${d.pct}%</span>
    </div>
  `).join('');

  app.innerHTML = `
    <div class="card">
      <p class="result-title-eyebrow">ผลการทดสอบของคุณ</p>
      <div class="result-head">
        <p class="result-title-eyebrow">บุคลิกความยั่งยืนในแบบของคุณคือ</p>
        <h2 class="result-title">${top.persona}</h2>
        <p class="result-track" style="color:${topColor}">${top.name}</p>
      </div>
      <div class="character-wrap">${buildCharacter(top)}</div>
      <div class="result-body">
        <p>${top.mission}</p>
        <p style="font-weight:600;">${top.help}</p>
        <div class="project-box">
          <p class="project-label">เกี่ยวข้องกับโปรเจกต์จริงของ ปตท.</p>
          <p class="project-text">${top.project}</p>
        </div>
      </div>

      <p class="section-label">แผนที่พลังความยั่งยืนของคุณ</p>
      <div class="radar-wrap">${buildRadarSVG(data)}</div>
      <div class="legend">${legend}</div>

      <div class="qr-cta">
        <div class="qr-cta-text">
          <p class="qr-cta-title">อยากอัปสกิลด้าน Sustainability เพิ่มอีกนิดไหม? 🌱</p>
          <p class="qr-cta-desc">ไปเรียนรู้เรื่อง Sustainability แบบง่าย ๆ ผ่าน <span class="nowrap">E-learning</span> กันต่อได้เลย ✨</p>
          <p class="qr-cta-scan">สแกน QR Code เพื่อเริ่มเรียนรู้</p>
        </div>
        <div class="qr-cta-tile">
          <img src="qr-elearning.png" alt="QR code สำหรับเข้าเรียน E-learning ด้านความยั่งยืน" width="792" height="792">
        </div>
      </div>

      <div class="actions">
        <button class="btn" id="restartBtn">ทำอีกครั้ง</button>
        <button class="btn ghost" id="copyBtn">คัดลอกผลลัพธ์</button>
      </div>
      <p class="copied-note" id="copyNote"></p>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', restart);
  document.getElementById('copyBtn').addEventListener('click', ()=> copyResult(data, top));
}

function copyResult(data, top){
  const statLine = data.map(d=> `${TRACKS[d.key].name} ${d.pct}%`).join(' · ');
  const text = `ผลทดสอบ: ฉันเป็นคนยั่งยืนสาย “${top.persona}” (${top.name}) 🌱\n${statLine}\nเกี่ยวข้องกับ: ${top.project}`;
  const note = document.getElementById('copyNote');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text)
      .then(()=>{ note.textContent = 'คัดลอกแล้ว ✓'; })
      .catch(()=>{ note.textContent = text; });
  } else {
    note.textContent = text;
  }
}

function restart(){
  step = -1;
  renderIntro();
}

renderIntro();
</script>
