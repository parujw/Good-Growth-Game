<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>คุณเป็นคนยั่งยืนสายไหน?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#132038;
    --ink-soft:#4a5568;
    --paper:#faf9f5;
    --card:#ffffff;
    --line:#e6e2d8;
    --blue:#0072bc;

    --c-planning:#3e4c8a;
    --c-action:#e8702a;
    --c-people:#e85c6b;
    --c-story:#e0a233;
    --c-guardian:#2f7566;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  .btn,.opt{
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Sarabun',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px 64px;
    line-height:1.6;
    overscroll-behavior:none;
    user-select:none;
  }
  .copied-note{user-select:text;}
  .nowrap{white-space:nowrap;}
  .stage{width:100%; max-width:620px;}

  .flag{
    position:relative;
    height:14px;
    display:flex;
    border-radius:3px;
    overflow:hidden;
    margin-bottom:22px;
  }
  .flag span{flex:1;}
  .flag span:nth-child(1){background:var(--c-planning);}
  .flag span:nth-child(2){background:var(--c-action);}
  .flag span:nth-child(3){background:var(--c-people);}
  .flag span:nth-child(4){background:var(--c-story);}
  .flag span:nth-child(5){background:var(--c-guardian);}

  .brand{
    font-family:'Kanit',sans-serif;
    font-weight:500;
    font-size:13px;
    letter-spacing:.02em;
    color:var(--ink-soft);
    margin:0 0 6px;
  }
  h1{
    font-family:'Kanit',sans-serif;
    font-weight:700;
    font-size:clamp(26px,5vw,34px);
    line-height:1.25;
    margin:0 0 10px;
  }
  .sub{
    color:var(--ink-soft);
    font-size:16px;
    max-width:52ch;
    margin:0 0 28px;
  }

  .btn{
    font-family:'Sarabun',sans-serif;
    font-weight:600;
    font-size:16px;
    border:none;
    cursor:pointer;
    border-radius:10px;
    padding:14px 26px;
    background:var(--ink);
    color:#fff;
    transition:transform .12s ease, opacity .12s ease;
  }
  @media (hover:hover){ .btn:hover{opacity:.88;} }
  .btn:active{transform:scale(.98);}
  .btn.ghost{
    background:transparent;
    color:var(--ink);
    border:1.5px solid var(--line);
  }
  @media (hover:hover){ .btn.ghost:hover{border-color:var(--ink); opacity:1;} }

  .progress{display:flex; gap:6px; margin-bottom:26px;}
  .dot{height:6px; flex:1; border-radius:4px; background:var(--line); transition:background .25s ease;}
  .dot.done{background:var(--ink);}
  .dot.current{background:var(--blue);}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:30px 28px;
    animation:rise .32s ease;
  }
  @keyframes rise{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .qnum{
    font-family:'Kanit',sans-serif;
    font-weight:600;
    color:var(--blue);
    font-size:13px;
    letter-spacing:.03em;
    margin-bottom:10px;
  }
  .scenario{font-size:19px; font-weight:500; margin:0 0 22px;}
  .options{display:flex; flex-direction:column; gap:10px;}
  .opt{
    display:flex;
    align-items:center;
    gap:12px;
    text-align:left;
    background:var(--paper);
    border:1.5px solid #d9d3c4;
    border-radius:12px;
    padding:13px 16px;
    font-family:'Sarabun',sans-serif;
    font-size:15px;
    color:var(--ink);
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  @media (hover:hover){ .opt:hover{border-color:var(--blue); background:#fff;} }
  .opt:active{transform:scale(.985);}
  .opt.picked{background:var(--ink); color:#fff; border-color:var(--ink);}
  .opt:disabled{cursor:default; opacity:.5;}
  .opt.picked:disabled{opacity:1;}
  .opt-num{
    flex-shrink:0;
    width:30px;
    height:30px;
    border-radius:9px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Kanit',sans-serif;
    font-weight:600;
    font-size:15px;
    line-height:1;
    color:#fff;
  }
  .opt-text{flex:1;}

  .intro-art{display:flex; gap:8px; margin:6px 0 24px; flex-wrap:wrap;}
  .chip{
    font-family:'Kanit',sans-serif;
    font-size:12.5px;
    font-weight:500;
    color:#fff;
    padding:6px 12px;
    border-radius:999px;
  }

  .result-cols{display:flex; flex-direction:column;}
  .result-head{text-align:center; margin-bottom:6px;}
  .result-title-eyebrow{font-family:'Kanit',sans-serif; font-size:13px; color:var(--ink-soft); margin:0 0 3px;}
  .result-title{font-family:'Kanit',sans-serif; font-size:26px; font-weight:700; margin:0;}
  .result-track{font-family:'Kanit',sans-serif; font-size:14px; font-weight:600; margin:4px 0 0;}
  .character-wrap{display:flex; justify-content:center; margin:6px 0 14px;}
  .character-wrap svg{width:190px; height:auto;}
  .result-body p{font-size:16px; margin:0 0 14px;}
  .result-lead{font-weight:600;}
  .result-detail{color:var(--ink-soft); font-size:15px;}
  .work-box{
    background:var(--paper);
    border:1px solid var(--line);
    border-left:4px solid var(--blue);
    border-radius:8px;
    padding:12px 14px;
    margin:2px 0 4px;
  }
  .work-label{
    font-family:'Kanit',sans-serif;
    font-size:14px;
    font-weight:600;
    line-height:1.4;
    color:var(--blue);
    margin:0 0 6px;
  }
  .work-text{font-size:14.5px; margin:0; color:var(--ink-soft);}
  .work-text strong{font-weight:600; color:var(--ink);}
  .section-label{font-family:'Kanit',sans-serif; font-size:13px; font-weight:600; color:var(--ink-soft); margin:26px 0 6px;}

  .radar-wrap{display:flex; justify-content:center; margin:6px 0 4px;}
  .radar-wrap svg{width:100%; max-width:388px; height:auto;}
  .radar-label{font-family:'Sarabun',sans-serif; font-weight:600;}
  .radar-pct{font-family:'Kanit',sans-serif; font-weight:600;}

  .legend{display:flex; flex-direction:column; gap:8px; margin-top:18px;}
  .legend-row{display:flex; align-items:center; gap:10px; font-size:14px;}
  .legend-dot{width:10px; height:10px; border-radius:50%; flex-shrink:0;}
  .legend-name{flex:1;}
  .legend-pct{font-family:'Kanit',sans-serif; font-weight:600; color:var(--ink-soft);}

  .qr-cta{
    display:flex;
    align-items:center;
    gap:18px;
    margin-top:26px;
    padding:18px;
    border-radius:14px;
    background:var(--ink);
    color:#fff;
  }
  .qr-cta-text{flex:1; min-width:0;}
  .qr-cta-title{
    font-family:'Kanit',sans-serif;
    font-weight:600;
    font-size:16.5px;
    line-height:1.45;
    margin:0 0 6px;
    text-wrap:balance;
  }
  .qr-cta-desc{font-size:14px; line-height:1.55; margin:0; color:#b9c2d4;}
  .qr-cta-scan{
    font-family:'Kanit',sans-serif;
    font-size:12.5px;
    font-weight:500;
    letter-spacing:.02em;
    color:#8fb9dd;
    margin:10px 0 0;
  }
  .qr-cta-tile{
    background:#fff;
    border-radius:10px;
    padding:8px;
    flex-shrink:0;
    line-height:0;
  }
  .qr-cta-tile img{width:140px; height:140px; max-width:100%; display:block;}
  @media (max-width:470px){
    .qr-cta{flex-direction:column; align-items:stretch; text-align:center;}
    .qr-cta-tile{align-self:center;}
    .qr-cta-tile img{width:172px; height:172px;}
  }

  /* Touchscreen kiosk: a laptop at the booth. Scale everything up, put the
     result side by side so it fits without scrolling, and size every tap
     target for a finger rather than a cursor. */
  @media (min-width:1024px){
    body{padding:40px 32px 56px;}
    .stage{max-width:1060px;}
    .flag{height:18px; margin-bottom:28px;}
    .brand{font-size:16px;}
    h1{font-size:clamp(38px,3.8vw,54px);}
    .sub{font-size:20px; max-width:58ch; margin-bottom:34px;}
    .chip{font-size:15px; padding:8px 16px;}
    .btn{font-size:20px; padding:20px 38px; border-radius:14px;}

    .card{padding:44px 48px; border-radius:22px;}
    .progress{gap:8px; margin-bottom:30px;}
    .dot{height:8px;}
    .qnum{font-size:16px; margin-bottom:14px;}
    .scenario{font-size:28px; margin-bottom:30px;}

    .options{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
    .opt{
      min-height:88px;
      gap:16px;
      font-size:19px;
      padding:20px 24px;
      border-radius:16px;
    }
    .opt:nth-child(5){grid-column:1 / -1;}
    .opt-num{width:38px; height:38px; border-radius:12px; font-size:19px;}

    .result-cols{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:44px;
      align-items:start;
    }
    .result-col > .section-label:first-child{margin-top:0;}
    .result-title{font-size:34px;}
    .result-track{font-size:17px;}
    .result-title-eyebrow{font-size:15px;}
    .character-wrap svg{width:250px;}
    .result-body p{font-size:18px;}
    .work-text{font-size:16px;}
    .section-label{font-size:15px;}
    .radar-wrap svg{max-width:100%;}
    .legend-row{font-size:17px;}
    .legend-dot{width:13px; height:13px;}

    .qr-cta{gap:22px; padding:22px;}
    .qr-cta-title{font-size:19px;}
    .qr-cta-desc{font-size:16px;}
    .qr-cta-scan{font-size:14px;}
    .qr-cta-tile img{width:168px; height:168px;}

    .actions{gap:16px; margin-top:34px;}
    .copied-note{font-size:15px;}
  }

  /* Booth laptops are wide but short (1366x768 is the common one). Tighten
     the vertical rhythm there so the result — QR included — lands in one
     screen instead of hiding the call to action below the fold. */
  @media (min-width:1024px) and (max-height:900px){
    body{padding:22px 28px 30px;}
    .flag{height:13px; margin-bottom:16px;}
    .card{padding:26px 34px;}
    .progress{margin-bottom:22px;}
    .scenario{font-size:25px; margin-bottom:22px;}
    .opt{min-height:72px; font-size:18px; padding:14px 20px;}
    .opt-num{width:34px; height:34px; font-size:17px;}
    .btn{font-size:18px; padding:16px 30px;}

    .result-cols{gap:36px;}
    .result-title{font-size:30px;}
    .character-wrap{margin:2px 0 8px;}
    .character-wrap svg{width:180px;}
    .result-body p{font-size:16px; margin-bottom:12px;}
    .section-label{margin:14px 0 4px;}
    .radar-wrap svg{max-width:310px;}
    .legend{gap:7px; margin-top:12px;}
    .legend-row{font-size:15px;}
    .qr-cta{margin-top:16px; padding:16px; gap:16px;}
    .qr-cta-title{font-size:17px;}
    .qr-cta-desc{font-size:14px;}
    .qr-cta-tile img{width:132px; height:132px;}
    .actions{margin-top:22px;}
  }

  .actions{display:flex; gap:12px; margin-top:28px; flex-wrap:wrap;}
  .copied-note{font-size:13px; color:var(--ink-soft); margin-top:8px; height:16px;}
</style>
</head>
<body>
<div class="stage">
  <div class="flag"><span></span><span></span><span></span><span></span><span></span></div>
  <div id="app"></div>
</div>

<script>
const TRACKS = {
  planning:{
    name:"สายวางแผน",
    persona:"นักวางแผน",
    color:"var(--c-planning)",
    hex:"#3e4c8a",
    dark:"#2b3667",

    mission:"ก่อนจะตัดสินใจอะไร คุณมองภาพใหญ่ก่อนเสมอ ว่าคุ้มไหม เสี่ยงตรงไหน แล้วอีกหลายปีข้างหน้าจะเป็นยังไง องค์กรถึงโตได้โดยไม่ต้องมาแก้ปัญหาทีหลัง",

    prop:`<g transform="translate(178,55) rotate(-15)">

    hair:"short",

    work:"ปรับปรุงกระบวนการทำงานให้ <strong>ใช้ทรัพยากรและพลังงานอย่างมีประสิทธิภาพ</strong> ลดของเสียและการปล่อย GHG",
    prop:`<g transform="translate(174,48) rotate(-15)">
      <rect x="13" y="6" width="11" height="42" rx="5.5" fill="#dfe2e6" stroke="#7a4419" stroke-width="2"/>
      <circle cx="18.5" cy="9" r="10" fill="none" stroke="#dfe2e6" stroke-width="7"/>
      <circle cx="18.5" cy="9" r="10" fill="none" stroke="#7a4419" stroke-width="2"/>

      </g>`
  },
  people:{
    name:"สายดูแลคน",
    persona:"นักพัฒนาคน",
    color:"var(--c-people)",
    hex:"#e85c6b",
    dark:"#a83745",

    glasses:"round",
    hair:"part",
    mission:"คุณมองเห็นคนก่อนเสมอ ใครกำลังเหนื่อย ใครอยากเก่งขึ้น คุณพร้อมช่วย เพราะรู้ว่าองค์กรจะไปได้ไกลแค่ไหน ขึ้นอยู่กับว่าคนข้างในแข็งแรงแค่ไหน",

    work:"พัฒนาความรู้และทักษะ ดูแล <strong>คุณภาพชีวิต ความปลอดภัย และความเป็นอยู่ที่ดี</strong> ของพนักงาน เพื่อให้คนพร้อมเติบโตไปกับองค์กร",
    prop:`<g transform="translate(176,56) rotate(-8)">
      <path d="M20 44 C0 28 0 9 14 5 C19 3.5 20 11 20 13 C20 11 21 3.5 26 5 C40 9 40 28 20 44 Z" fill="#e85c6b" stroke="#8a2b3b" stroke-width="2"/>

      </g>`
  },
  guardian:{
    name:"สายปกป้อง",
    persona:"ผู้พิทักษ์",
    color:"var(--c-guardian)",
    hex:"#2f7566",
    dark:"#1c5044",
    tint:"#e8f2ef",
    glasses:"rect",

    help:"คุณคือคนที่ทำให้ทุกคนทำงานได้อย่างสบายใจ",
    work:"ดูแล <strong>กฎหมาย จริยธรรม ธรรมาภิบาล ความเสี่ยง และความปลอดภัย</strong> เพื่อให้องค์กรเติบโตอย่างรับผิดชอบและมั่นคง",
    prop:`<g transform="translate(178,55) rotate(-15)">
      <path d="M20 0 L38 8 L38 26 C38 40 28 48 20 52 C12 48 2 40 2 26 L2 8 Z" fill="#dfe2e6" stroke="#1f574d" stroke-width="2"/>
      <path d="M20 6 L34 12 L34 26 C34 37 26 44 20 47 Z" fill="#2f7566"/>
      <path d="M12 26 L18 33 L30 18" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>`
  }
};

const TRACK_ORDER = ["planning","action","people","story","guardian"];

const QUESTIONS = [
  {
    scenario:"เจอปัญหาใหญ่ในทีม คุณมักจะ...",
    options:[
      {t:"คิดแผนระยะยาวก่อนว่าทำแบบไหนคุ้มค่าที่สุด", k:"planning"},
      {t:"ลงมือแก้ปัญหาหน้างานทันที", k:"action"},
      {t:"ถามความเห็นเพื่อนร่วมทีมก่อนตัดสินใจ", k:"people"},
      {t:"อธิบายสถานการณ์ให้ทุกคนเข้าใจตรงกันก่อน", k:"story"},
      {t:"เช็คก่อนว่าทำแบบนี้ถูกต้องและปลอดภัยไหม", k:"guardian"}
    ]
  },
  {

// ---------- kiosk ----------
// At a booth the laptop is shared: whoever walks up next should find the
// intro, not the previous player's result. Reset after a stretch of no touch.
const IDLE_RESET_MS = 90000;
let idleTimer = null;

function resetIdleTimer(){
  clearTimeout(idleTimer);
  if(step === -1) return;           // already waiting on the intro
  idleTimer = setTimeout(restart, IDLE_RESET_MS);
}

function toggleFullscreen(){
  if(document.fullscreenElement){
    document.exitFullscreen && document.exitFullscreen();
  } else {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    req && req.call(el);
  }
}

document.addEventListener('fullscreenchange', ()=>{
  const btn = document.getElementById('fsBtn');
  if(btn) btn.textContent = document.fullscreenElement ? 'ออกจากเต็มจอ' : 'เต็มจอ';
});

['pointerdown','keydown'].forEach(ev=>{
  document.addEventListener(ev, resetIdleTimer, {passive:true});
});

function renderIntro(){
  const chips = TRACK_ORDER.map(k=>{
    const v = TRACKS[k];
    return `<span class="chip" style="background:${v.color}">${v.name}</span>`;
  }).join('');
  app.innerHTML = `
    <p class="brand">GOOD GROWTH · โตได้ โตดี</p>
    <h1>คุณเป็นคนยั่งยืนสายไหน?</h1>

  `;

  document.getElementById('fsBtn').addEventListener('click', toggleFullscreen);
  clearTimeout(idleTimer);
}

function startQuiz(){
  step = 0;
  TRACK_ORDER.forEach(k=>scores[k]=0);
  renderQuestion();
}

function renderProgress(){
  return `<div class="progress">${QUESTIONS.map((_,i)=>{
    let cls='dot';
    if(i<step) cls+=' done';
    if(i===step) cls+=' current';
    return `<div class="${cls}"></div>`;
  }).join('')}</div>`;
}

function renderQuestion(){
  answered = false;
  const q = QUESTIONS[step];
  app.innerHTML = `
    ${renderProgress()}
    <div class="card">
      <p class="qnum">ข้อ ${step+1} / ${QUESTIONS.length}</p>
      <p class="scenario">${q.scenario}</p>
      <div class="options">
        ${q.options.map((o,i)=>`<button class="opt" data-i="${i}">
          <span class="opt-num" style="background:${TRACKS[o.k].color}">${i+1}</span>
          <span class="opt-text">${o.t}</span>
        </button>`).join('')}
      </div>
    </div>
  `;
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.addEventListener('click', ()=> pick(Number(btn.dataset.i)));
  });
  resetIdleTimer();
}

function pick(i){
  if(answered) return;
  answered = true;
  const q = QUESTIONS[step];
  scores[q.options[i].k]++;
  document.querySelectorAll('.opt').forEach((el,idx)=>{
    el.disabled = true;
    if(idx===i) el.classList.add('picked');
  });
  setTimeout(()=>{
    step++;
    if(step<QUESTIONS.length){ renderQuestion(); }
    else { renderResult(); }
  }, 380);
}

// ---------- radar / strength web map ----------
function polar(cx,cy,r,angleDeg){
  const rad = (Math.PI/180)*(angleDeg-90);
  return [cx + r*Math.cos(rad), cy + r*Math.sin(rad)];
}

function buildRadarSVG(data){
  // data: array in TRACK_ORDER order of {key,label,pct,color}
  const n = data.length;
  const cx=160, cy=160, maxR=100;
  const step = 360/n;
  const levels = [0.25,0.5,0.75,1];

  const gridPolys = levels.map(l=>{
    const pts = data.map((d,i)=> polar(cx,cy,maxR*l, i*step).join(',')).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="#e6e2d8" stroke-width="1"/>`;
  }).join('');

  const spokes = data.map((d,i)=>{
    const [x,y] = polar(cx,cy,maxR, i*step);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e6e2d8" stroke-width="1"/>`;
  }).join('');

  const dataPts = data.map((d,i)=> polar(cx,cy, maxR*(d.pct/100), i*step).join(',')).join(' ');

  const dots = data.map((d,i)=>{
    const [x,y] = polar(cx,cy, maxR*(d.pct/100), i*step);
    return `<circle cx="${x}" cy="${y}" r="4.5" fill="${d.color}" stroke="#fff" stroke-width="1.5"/>`;
  }).join('');

  const labels = data.map((d,i)=>{
    const [lx,ly] = polar(cx,cy, maxR+34, i*step);
    let anchor='middle';
    if(lx < cx-8) anchor='end';
    else if(lx > cx+8) anchor='start';
    return `
      <text x="${lx}" y="${ly-3}" text-anchor="${anchor}" class="radar-label" font-size="12.5" fill="var(--ink)">${d.label}</text>
      <text x="${lx}" y="${ly+13}" text-anchor="${anchor}" class="radar-pct" font-size="13" fill="${d.color}">${d.pct}%</text>
    `;
  }).join('');

  return `
    <svg viewBox="-34 0 388 320" xmlns="http://www.w3.org/2000/svg">
      ${gridPolys}
      ${spokes}
      <polygon points="${dataPts}" fill="var(--blue)" fill-opacity="0.22" stroke="var(--blue)" stroke-width="2"/>
      ${dots}
      ${labels}
    </svg>
  `;
}

function copyResult(data, top){
  const statLine = data.map(d=> `${TRACKS[d.key].name} ${d.pct}%`).join(' · ');
  const work = top.work.replace(/<[^>]+>/g, '');
  const text = `ผลทดสอบ: ฉันเป็นคนยั่งยืนสาย “${top.persona}” (${top.name}) 🌱\n${statLine}\nงานของคุณ ก็สร้าง Good Growth ได้: ${work}`;
  const note = document.getElementById('copyNote');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text)
      .then(()=>{ note.textContent = 'คัดลอกแล้ว ✓'; })
      .catch(()=>{ note.textContent = text; });
  } else {
    note.textContent = text;
  }
}
